server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React app — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}